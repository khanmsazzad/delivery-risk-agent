[project]
name = "delivery-risk-agent"
version = "0.1.0" 
description =  "An agentic workflow for detecting software delivery risks"
requires-python = ">=3.11"
dependencies = [
	"pydantic",
     "openai-agents",
     "fastapi",
     "uvicorn",
     "python-dotenv",
]

[project.optional-dependencies]
dev = [
     "pytest",
     "ruff",	
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: tests requiring the local llama.cpp server",
]

[tool.ruff]
line-length = 100 